[pytest]
addopts = --ignore=src --ignore=examples --ignore=venv --ignore=.venv --ignore=env --ignore=.env -m "not slow"
markers =
    slow: long-running tests that need extra packages or data; run with -m slow
log_cli = 0
log_cli_level = INFO
log_cli_format = [%(asctime)s | %(levelname)5s | %(filename)s:%(funcName)s:%(lineno)s]: %(message)s
log_cli_date_format=%Y-%m-%d %H:%M:%S %Z
