name: Core API compatibility (Python 3.13.2)

on:
  pull_request:
    paths:
      - 'src/infer_ci/**'
      - 'tests/test_core_api_compatibility.py'
      - 'requirements/requirements.compatibility.txt'
      - '.github/workflows/core-python313.yml'
  push:
    branches: [main]
    paths:
      - 'src/infer_ci/**'
      - 'tests/test_core_api_compatibility.py'
      - 'requirements/requirements.compatibility.txt'
      - '.github/workflows/core-python313.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
          cache: pip
          cache-dependency-path: requirements/requirements.compatibility.txt
      - name: Install core test dependencies
        run: python -m pip install -r requirements/requirements.compatibility.txt
      - name: Verify interpreter and core API contracts
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3, 13, 2), sys.version"
          python -m pytest -q tests/test_core_api_compatibility.py
