name: CI

# Runs the full test suite and a docs build on every pull request, so changes
# outside src/ (notebook helpers, their tests, docs) are checked before merge.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version and the version the team agreed on.
        python-version: ["3.10", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/requirements.test.txt
      - name: Install infer-ci with test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
      - name: Run tests
        # pytest.ini skips tests marked "slow" (extra packages or data needed).
        run: python -m pytest -n auto

  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/requirements.docs.txt
      - name: Install infer-ci with docs dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[docs]"
      - name: Build docs
        # Not --strict yet: dev already has ~60 broken-link warnings. This still
        # fails on config, nav (.nav.yml) and API-reference errors. Switch to
        # --strict once the existing links are fixed.
        run: mkdocs build --site-dir /tmp/site
